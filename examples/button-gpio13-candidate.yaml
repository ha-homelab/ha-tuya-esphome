# Candidate only: verify the physical button on each unknown model.
# Requires the relay id from relay-gpio12-candidate.yaml.
# GPIO13 button events are observed, but toggling GPIO12 does not prove relay control.
binary_sensor:
  - platform: gpio
    name: Physical Button
    pin:
      number: GPIO13
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - switch.toggle: relay
