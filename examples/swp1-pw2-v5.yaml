# Standalone profile for the verified SWP1-PW2-V5 / TYWE3S sample.
# See ../docs/swp1-pw2-v5.md before wiring or flashing another revision.
# Keep this file and secrets.yaml in a private build directory.
esphome:
  name: swp1-pw2-v5
  friendly_name: SWP1 Switch
  name_add_mac_suffix: true
  compile_process_limit: 2

esp8266:
  board: esp_wroom_02
  board_flash_mode: dout
  early_pin_init: false
  restore_from_flash: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret fallback_password

captive_portal:

# GPIO3 is both the physical button and UART RX. Disconnect UART after flashing.
logger:
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

status_led:
  pin:
    number: GPIO0
    inverted: true

output:
  - platform: gpio
    id: relay_indicator
    pin:
      number: GPIO14
      inverted: true

switch:
  - platform: gpio
    id: relay
    name: None
    pin: GPIO13
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - output.turn_on: relay_indicator
    on_turn_off:
      - output.turn_off: relay_indicator

binary_sensor:
  - platform: gpio
    id: physical_button
    internal: true
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 30ms
    on_press:
      - switch.toggle: relay
  - platform: status
    name: Status

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s

text_sensor:
  - platform: version
    name: ESPHome Version

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic
