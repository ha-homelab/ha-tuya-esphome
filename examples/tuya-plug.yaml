# First-install ESP8266 firmware; intentionally does not assign unknown GPIOs.
esphome:
  name: tuya-plug
  friendly_name: Tuya Plug
  name_add_mac_suffix: true
  compile_process_limit: 1

esp8266:
  board: esp01_1m
  restore_from_flash: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .home.arpa
  ap:
    password: !secret fallback_password

captive_portal:

logger:
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s

text_sensor:
  - platform: version
    name: ESPHome Version

binary_sensor:
  - platform: status
    name: Status
