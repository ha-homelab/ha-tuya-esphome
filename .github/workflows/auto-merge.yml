# Read trusted base metadata only; do not check out or execute PR code.
name: Auto Merge PRs
'on':
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
      - edited
      - converted_to_draft
  workflow_run:
    workflows: ["Auto Approve PRs", "CodeQL", "Validate workbench"]
    types: [completed]
  status:
  check_run:
    types: [completed]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: automerge-${{ github.event.pull_request.number }}-${{ contains(fromJSON('["workflow_run","status","check_run","schedule","workflow_dispatch"]'), github.event_name) && github.run_id || (github.event.action != 'edited' || github.event.changes.base) && 'state' || github.run_id }}
  cancel-in-progress: true
jobs:
  auto-merge:
    permissions:
      contents: read
      pull-requests: write
    if: >-
      (github.event.action != 'edited' || github.event.changes.base) &&
      contains(fromJSON('["4alvit","californiantiramisu","dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-merge.yml@0047a13b5eb79dfa770e31070a83e9696ddd36d1 # main
    with:
      # This repository protects "check"; native mode requires a protected "CI gate".
      reviewed-merge: true
      reviewed-single-pass: true
      # Match the official Actions approval paths already enabled by auto-approve.
      allow-dependabot-actions-review: true
      allow-owned-bot-actions-review: true
      required-status-checks: check
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}

  recover-auto-merge:
    permissions:
      contents: read
      pull-requests: write
    if: >-
      contains(fromJSON('["workflow_run","status","check_run","schedule","workflow_dispatch"]'), github.event_name) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    concurrency:
      group: automerge-reviewed-recovery-${{ github.repository }}
      cancel-in-progress: false
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-merge.yml@0047a13b5eb79dfa770e31070a83e9696ddd36d1 # main
    with:
      reviewed-merge: true
      allow-dependabot-actions-review: true
      allow-owned-bot-actions-review: true
      required-status-checks: "check"
      reviewed-single-pass: true
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
