name: Auto Approve PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number }}-${{ (github.event.action != 'edited' || github.event.changes.base) && 'state' || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  auto-approve:
    permissions:
      contents: read
      pull-requests: write
    if: >-
      (github.event.action != 'edited' || github.event.changes.base) &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository)) &&
      contains(fromJSON('["4alvit","californiantiramisu","dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login) &&
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml@de4848ae46c03248095a31edc937cddd523d7ac0
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
      APPROVAL_PAT: ${{ secrets.APPROVAL_PAT }}
  bootstrap-bot-access:
    # One-time acceptance of the owner's explicit, repository-scoped invitation.
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'ha-homelab/ha-tuya-esphome' &&
      github.event.pull_request.number == 2 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == '4alvit' &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Accept the approved bot invitation for this repository
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          set -euo pipefail
          test "$(gh api user --jq .login)" = californiantiramisu
          invitation=$(gh api user/repository_invitations --jq '.[] | select(.id == 337222818 and .repository.full_name == "ha-homelab/ha-tuya-esphome") | .id')
          if test "$invitation" = 337222818; then
            gh api --method PATCH user/repository_invitations/337222818 --silent
          fi
          test "$(gh api repos/ha-homelab/ha-tuya-esphome --jq .permissions.push)" = true
