<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="940" viewBox="0 0 1320 940" role="img" aria-labelledby="title desc">
  <title id="title">SWP1-PW2-V5 / TYWE3S: isolated low-voltage serial wiring</title>
  <desc id="desc">A 5 volt UART adapter connects through a two-channel level translator. Adapter TX goes to HV1, LV1 goes to module RXD0. Module TXD0 goes to LV2, HV2 goes to adapter RX. An external regulated 3.3 volt supply powers module VCC and translator LV; adapter 5V powers translator HV. All grounds are common. GPIO0 is held low during reset to enter download mode; RST is pulsed low and released, while EN stays high. Mains must be disconnected. Diagram does not depict physical pad positions.</desc>
  <rect width="1320" height="940" rx="20" fill="#f5f8fc" />
  <text x="40" y="50" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="30px" font-weight="700">TYWE3S serial programming · 5 V UART with a level translator</text>
  <text x="40" y="85" font-family="Arial,Helvetica,sans-serif" fill="#45566f" font-size="17px">Functional connections only — identify actual pads from the module datasheet.</text>
  <rect x="950" y="112" width="330" height="84" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-opacity="1" />
  <text x="1115" y="146" text-anchor="middle" fill="#991b1b" font-family="Arial,Helvetica,sans-serif" font-size="22px" font-weight="700">MAINS DISCONNECTED</text>
  <text x="1115" y="176" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#45566f" font-size="16px">No AC during wiring or programming</text>
  <rect x="480" y="130" width="310" height="78" rx="12" fill="#fff2d8" stroke="#edb559" stroke-width="2" stroke-opacity="1" />
  <text x="635" y="160" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="22px" font-weight="700">Regulated 3.3 V supply</text>
  <text x="635" y="186" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#45566f" font-size="16px">Measure at the loaded module</text>
  <path stroke="#d97706" stroke-width="4" fill="none" d="M635 130 V110 H905 V282 H950" stroke-opacity="1" />
  <text x="822" y="132" font-family="Arial,Helvetica,sans-serif" fill="#45566f" font-size="16px">3.3 V</text>
  <path stroke="#d97706" stroke-width="4" fill="none" d="M550 208 V226 H438 V282 H480" stroke-opacity="1" />
  <path stroke="#64748b" stroke-width="4" fill="none" d="M790 170 H824 V214 H1300 V683 H1115" stroke-opacity="1" />
  <text x="825" y="196" font-family="Arial,Helvetica,sans-serif" fill="#45566f" font-size="16px">Supply −</text>
  <rect x="899" y="210" width="12" height="9" fill="#f5f8fc" />
  <path d="M905 208 V221" stroke="#d97706" stroke-width="4" stroke-opacity="1" fill="none" />
  <rect x="40" y="246" width="290" height="395" rx="18" fill="#eaf2ff" stroke="#93b8e9" stroke-width="2" stroke-opacity="1" />
  <rect x="480" y="246" width="310" height="395" rx="18" fill="#fffaf0" stroke="#dfbd79" stroke-width="2" stroke-opacity="1" />
  <rect x="950" y="246" width="330" height="395" rx="18" fill="#e9f8f1" stroke="#81c4a6" stroke-width="2" stroke-opacity="1" />
  <text x="185" y="286" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="22px" font-weight="700">USB–UART adapter</text>
  <text x="185" y="312" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#45566f" font-size="16px">USB to programming host</text>
  <text x="635" y="315" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="22px" font-weight="700">HV / LV translator</text>
  <text x="1115" y="332" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="22px" font-weight="700">TYWE3S</text>
  <text x="1115" y="358" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#45566f" font-size="16px">ESP8266 target</text>
  <text x="311" y="345" text-anchor="end" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="19px" font-weight="700">5V</text>
  <path stroke="#d97706" stroke-width="4" fill="none" d="M330 338 H480" stroke-opacity="1" />
  <circle cx="330" cy="338" r="6" fill="#d97706" />
  <circle cx="480" cy="338" r="6" fill="#d97706" />
  <text x="498" y="344" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="19px" font-weight="700">HV</text>
  <text x="498" y="288" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="19px" font-weight="700">LV: 3.3 V</text>
  <circle cx="480" cy="282" r="6" fill="#d97706" />
  <text x="970" y="288" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="19px" font-weight="700">VCC: 3.3 V</text>
  <circle cx="950" cy="282" r="6" fill="#d97706" />
  <text x="311" y="411" text-anchor="end" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="19px" font-weight="700">TX</text>
  <path stroke="#2563eb" stroke-width="4" fill="none" d="M330 405 H472" stroke-opacity="1" />
  <polygon points="472,405 458,397 458,413" fill="#2563eb" />
  <text x="499" y="397" font-family="Consolas,monospace" fill="#17253b" font-size="19px">HV1</text>
  <path stroke="#2563eb" stroke-width="4" fill="none" d="M555 405 H713" stroke-opacity="1" />
  <polygon points="713,405 699,397 699,413" fill="#2563eb" />
  <text x="771" y="397" text-anchor="end" font-family="Consolas,monospace" fill="#17253b" font-size="19px">LV1</text>
  <path stroke="#2563eb" stroke-width="4" fill="none" d="M790 405 H942" stroke-opacity="1" />
  <polygon points="942,405 928,397 928,413" fill="#2563eb" />
  <text x="971" y="411" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="19px" font-weight="700">RXD0 / GPIO3</text>
  <text x="971" y="438" font-family="Arial,Helvetica,sans-serif" fill="#45566f" font-size="16px">Also the physical button input</text>
  <rect x="360" y="373" width="87" height="24" rx="6" fill="#dbeafe" />
  <text x="403" y="390" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#45566f" font-size="16px">5 V logic</text>
  <text x="311" y="496" text-anchor="end" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="19px" font-weight="700">RX</text>
  <path stroke="#0f766e" stroke-width="4" fill="none" d="M480 490 H338" stroke-opacity="1" />
  <polygon points="338,490 352,482 352,498" fill="#0f766e" />
  <text x="499" y="480" font-family="Consolas,monospace" fill="#17253b" font-size="19px">HV2</text>
  <path stroke="#0f766e" stroke-width="4" fill="none" d="M715 490 H557" stroke-opacity="1" />
  <polygon points="557,490 571,482 571,498" fill="#0f766e" />
  <text x="771" y="480" text-anchor="end" font-family="Consolas,monospace" fill="#17253b" font-size="19px">LV2</text>
  <path stroke="#0f766e" stroke-width="4" fill="none" d="M950 490 H798" stroke-opacity="1" />
  <polygon points="798,490 812,482 812,498" fill="#0f766e" />
  <text x="971" y="496" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="19px" font-weight="700">TXD0</text>
  <text x="868" y="529" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#45566f" font-size="16px">3.3 V logic</text>
  <text x="635" y="553" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#45566f" font-size="16px">Match each HVn to the same LVn</text>
  <text x="185" y="575" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#45566f" font-size="16px">Adapter 3V3: NOT CONNECTED</text>
  <text x="185" y="608" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="19px" font-weight="700">GND</text>
  <text x="635" y="608" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="19px" font-weight="700">GND</text>
  <text x="1115" y="575" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#45566f" font-size="16px">EN remains HIGH</text>
  <text x="1115" y="608" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="19px" font-weight="700">GND</text>
  <path stroke="#64748b" stroke-width="4" fill="none" d="M185 620 V683 H1115 V620 M635 620 V683" stroke-opacity="1" />
  <circle cx="635" cy="683" r="6" fill="#64748b" />
  <circle cx="1115" cy="683" r="6" fill="#64748b" />
  <text x="650" y="716" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="18px">Common ground: adapter + translator + supply negative + module</text>
  <rect x="40" y="753" width="1240" height="151" rx="14" fill="#fff" stroke="#d5deea" stroke-opacity="1" />
  <rect x="40" y="753" width="9" height="151" rx="4" fill="#7c3aed" />
  <text x="68" y="785" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="22px" font-weight="700">Download mode and normal boot</text>
  <text x="68" y="819" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="18px">1. Power OFF → connect GPIO0 to GND → restore low-voltage power.</text>
  <text x="68" y="850" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="18px">2. Briefly pull RST to GND, then release RST. GPIO0 may stay grounded during flashing.</text>
  <text x="68" y="881" font-family="Arial,Helvetica,sans-serif" fill="#17253b" font-size="18px">3. Power OFF → remove GPIO0 bridge and UART wires → power ON for normal operation.</text>
</svg>
